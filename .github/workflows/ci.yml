name: CI

on:
  # Only run push on main
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  # Always run on PRs
  pull_request:
    branches: [ main ]
  merge_group:

concurrency:
  group: 'ci-${{ github.event.merge_group.head_ref || github.head_ref }}-${{ github.workflow }}'
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Export JDK version
        shell: bash
        run: |
          JDK_VERSION=$(grep "jdk =" gradle/libs.versions.toml | head -n 1 | cut -d'=' -f2 | tr -d '"' | xargs)
          echo "JDK_VERSION=${JDK_VERSION}" >> $GITHUB_ENV

      - name: Install JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '${{ env.JDK_VERSION }}'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only save Gradle User Home state for builds on the 'main' branch.
          # Builds on other branches will only read existing entries from the cache.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

          # Don't reuse cache entries from any other Job.
          gradle-home-cache-strict-match: true

          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build and run tests under isolated projects
        id: gradle
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/foundry-project-cache"
          args=(
            check
            --configuration-cache
            --configuration-cache-problems=fail
            -Dorg.gradle.unsafe.isolated-projects=true
            -Dorg.gradle.projectcachedir="$cache_dir"
            --console=plain
          )

          # IntelliJ Platform creates its layout index during the first check, after Gradle has
          # captured configuration inputs. Bootstrap that state before checking cache reuse.
          ./gradlew "${args[@]}" |& tee "$RUNNER_TEMP/foundry-bootstrap.log"
          ./gradlew "${args[@]}" |& tee "$RUNNER_TEMP/foundry-first.log"
          ./gradlew "${args[@]}" |& tee "$RUNNER_TEMP/foundry-second.log"
          grep -F "Reusing configuration cache." "$RUNNER_TEMP/foundry-second.log"

      - name: Verify CLI service loader with isolated projects disabled
        shell: bash
        run: |
          set -euo pipefail
          service_file="META-INF/services/foundry.cli.CommandFactory"

          # runCommand() discovers commands through Java ServiceLoader; KSP generates this descriptor.
          # KSP requires isolated projects to be disabled for the CLI packaging check.
          ./gradlew :tools:cli:jar \
            --configuration-cache-problems=fail \
            -Dorg.gradle.unsafe.isolated-projects=false \
            -Dorg.gradle.projectcachedir="$RUNNER_TEMP/foundry-cli-project-cache" \
            --console=plain

          cli_jar="tools/cli/build/libs/cli.jar"
          test -f "$cli_jar"
          unzip -p "$cli_jar" "$service_file" | tee "$RUNNER_TEMP/foundry-cli-command-factories"
          grep -Fqx 'foundry.cli.gradle.GradleProjectFlattenerCli$Factory' \
            "$RUNNER_TEMP/foundry-cli-command-factories"

      - name: Print build scan url
        if: always()
        run: echo ${{ steps.gradle.outputs.build-scan-url }}

      - name: (Fail-only) Upload build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**

  snapshots:
    runs-on: macos-latest
    env:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    steps:
        - name: Checkout
          uses: actions/checkout@v7
          with:
            lfs: 'true'

        - name: Check LFS files
          uses: actionsdesk/lfs-warning@v3.3

        - name: Export JDK version
          shell: bash
          run: |
            JDK_VERSION=$(grep "jdk =" gradle/libs.versions.toml | head -n 1 | cut -d'=' -f2 | tr -d '"' | xargs)
            echo "JDK_VERSION=${JDK_VERSION}" >> $GITHUB_ENV

        - name: Install JDK ${{ env.JDK_VERSION }}
          uses: actions/setup-java@v5
          with:
            distribution: 'zulu'
            java-version: '${{ env.JDK_VERSION }}'

        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v6
          with:
            # Only save Gradle User Home state for builds on the 'main' branch.
            # Builds on other branches will only read existing entries from the cache.
            cache-read-only: ${{ github.ref != 'refs/heads/main' }}

            # Don't reuse cache entries from any other Job.
            gradle-home-cache-strict-match: true

            cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

        - name: Build and run tests
          id: gradle
          timeout-minutes: 10
          run: ./gradlew verifyRoborazzi --quiet

        - name: (Fail-only) Upload build reports
          if: failure()
          uses: actions/upload-artifact@v7
          with:
            name: snapshot-reports
            path: |
              **/build/reports/**
              **/build/outputs/roborazzi/*.png

  publish-snapshot:
    name: 'Publish snapshot (main only)'
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: 'build'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Export JDK version
        shell: bash
        run: |
          JDK_VERSION=$(grep "jdk =" gradle/libs.versions.toml | head -n 1 | cut -d'=' -f2 | tr -d '"' | xargs)
          echo "JDK_VERSION=${JDK_VERSION}" >> $GITHUB_ENV

      - name: Install JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '${{ env.JDK_VERSION }}'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish snapshot
        if: github.repository == 'slackhq/foundry'
        # Disable isolated projects for publishing because the CLI module requires KSP
        # to generate service loader files, and KSP doesn't support isolated projects yet
        run: ./gradlew publish --quiet -Dorg.gradle.unsafe.isolated-projects=false -PmavenCentralUsername=${{ secrets.SONATYPEUSERNAME }} -PmavenCentralPassword=${{ secrets.SONATYPEPASSWORD }}
